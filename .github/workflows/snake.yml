name: Generate Spacecraft Grid

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Space Invaders Grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Difarias
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FF66&color_dots=#161b22,#013a18,#006d32,#00a648,#00ff66
